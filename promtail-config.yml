server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker container logs
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*-json.log

    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            attrs:
      - json:
          source: attrs
          expressions:
            tag:
      - regex:
          source: tag
          expression: '^.+/(?P<container_name>.+)-[a-z0-9]{12}$'
      - timestamp:
          source: time
          format: RFC3339Nano
      - labels:
          stream:
          container_name:

  # Application logs from OTEL collector
  - job_name: otel-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: otel-logs
          __path__: /tmp/logs/*.json

    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            service_name: resource_logs.resource.attributes.service.name
      - timestamp:
          source: timestamp
          format: RFC3339
      - labels:
          level:
          service_name: